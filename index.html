<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPSC AI-Quizzer</title>
    <script>
      (function() {
        // Shadow object for properties that can't be set on window
        const shadow = {};
        const originalFetch = window.fetch;

        // Try to redefine fetch to handle setter attempts from legacy polyfills/libraries
        try {
          Object.defineProperty(window, 'fetch', {
            get: function() { return shadow.fetch || originalFetch; },
            set: function(v) { shadow.fetch = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If sealed, we'll rely on the global/globalThis proxy fallback
        }

        // Global proxy handler
        const handler = {
          get: function(target, prop) {
            if (prop in shadow) return shadow[prop];
            const value = target[prop];
            if (typeof value === 'function' && value.bind) return value.bind(target);
            return value;
          },
          set: function(target, prop, value) {
            try {
              target[prop] = value;
            } catch (e) {
              shadow[prop] = value;
            }
            return true;
          },
          has: function(target, prop) {
            return prop in shadow || prop in target;
          }
        };

        const globalProxy = new Proxy(window, handler);

        // Define 'global' and 'globalThis'
        try {
          Object.defineProperty(window, 'global', { value: globalProxy, configurable: true, writable: true });
          Object.defineProperty(window, 'globalThis', { value: globalProxy, configurable: true, writable: true });
        } catch (e) {
          window.global = globalProxy;
          if (typeof globalThis !== 'undefined') {
             try { globalThis.global = globalProxy; } catch(err) {}
          }
        }

        // process shim
        if (typeof window.process === 'undefined') {
          window.process = {
            env: { NODE_ENV: 'development' },
            browser: true,
            version: '',
            nextTick: function(cb) { setTimeout(cb, 0); }
          };
        }

        // FormData stability
        if (typeof FormData !== 'undefined' && !FormData.prototype.keys) {
          FormData.prototype.keys = function*() {};
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
